[package]
name = "detent"
description = "Detent macOS menu bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Distinct from the `detent` binary's name (the usual Tauri 2 shape, D-052).
name = "detent_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
detent-protocol = { path = "../../protocol" }
hidapi = "2.6.7"  # same version as ctl-probe
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"  # field paths in config syntax errors
plist = "1"

# Native macOS bindings, used only from src/macos/ (the one unsafe module). Same
# objc2 family and versions Tauri already pulls in (D-053).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSRunLoop", "NSDate", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-audio"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }  # open at login (D-067)


[lints]
workspace = true
