[package]
name = "detent"
description = "Detent macOS menu bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Distinct from the `detent` binary's name (the usual Tauri 2 shape, D-052).
name = "detent_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# Native macOS bindings, used only from src/macos/ (the one unsafe module). Same
# objc2 family and versions Tauri already pulls in (D-053).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-audio"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
