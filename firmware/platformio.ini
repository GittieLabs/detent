; Detent firmware. ESP32-S3, Arduino-ESP32, TinyUSB. See docs/architecture.md.
; Build: pio run -d firmware   (or: just fw). Needs PlatformIO Core 6.2 or newer.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; Pinned so CI and local builds use the same core: Arduino-ESP32 3.3.12 on
; ESP-IDF 5.5.5, from the pioarduino platform (D-045). Its TinyUSB fixes an IN
; stall in 2.0.17 that made the host reset the device.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3  ; assumed board, open question in docs/roadmap.md
framework = arduino
build_src_filter = +<*> -<pico/>  ; src/pico is the RP2040 build's (M7)
monitor_speed = 115200
lib_deps =
    olikraus/U8g2 @ 2.36.18  ; OLED driver (D-050)

; The running firmware's TinyUSB CDC port reboots into the ROM bootloader on a
; 1200 baud touch, and the bootloader comes up as a different port (USB-JTAG).
; Without these, `pio run -t upload` needs two tries from a running app.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; The board defaults to the USB-Serial-JTAG peripheral (USB_MODE=1). Detent
; needs TinyUSB on the OTG peripheral (USB_MODE=0) for the composite vendor HID
; and Consumer Control device. CDC on boot is off so src/usb_device.cpp can set
; our VID and PID before USB starts; the variant's Seeed IDs never enumerate.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DDETENT_BOARD_XIAO_ESP32S3
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iinclude  ; libraries in lib/ include the generated detent_protocol.h
    ; The core's USB library compiles its USB host mass storage helper, which
    ; includes FS.h, without FS on its include path.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -Wall
    -Wextra

; Debug firmware: release plus TEST_INJECT replay and boot diagnostics on CDC,
; for hardware in the loop tests (scripts/hil.sh). Never ship it.
;   pio run -d firmware -e xiao_esp32s3_debug   (or: just fw-debug)
[env:xiao_esp32s3_debug]
extends = env:xiao_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -DDETENT_TEST_INJECT=1
    -DDETENT_DIAG=1
    -DDETENT_INPUT_LOG=1

; Adafruit ESP32-S3 Feather, 4 MB flash and 2 MB PSRAM (M7, D-097): the
; Feather's pin map (include/boards/feather_esp32s3.h). Model name and USB IDs
; are placeholders (open questions in docs/roadmap.md); for now it shares the
; XIAO's IDs.
[env:feather_esp32s3]
extends = env:xiao_esp32s3
board = adafruit_feather_esp32s3
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -UDETENT_BOARD_XIAO_ESP32S3
    -DDETENT_BOARD_FEATHER_ESP32S3
    '-DDETENT_MODEL_NAME="Feather"'

[env:feather_esp32s3_debug]
extends = env:feather_esp32s3
build_flags =
    ${env:feather_esp32s3.build_flags}
    -DDETENT_TEST_INJECT=1
    -DDETENT_DIAG=1
    -DDETENT_INPUT_LOG=1

; ESP32-S3 DevKitC-1 class board with an N16R8 module (M7, D-116, D-118):
; 16 MB quad flash and 8 MB octal PSRAM, so the octal memory setting
; (qio_opi). Detent runs on the port labelled USB (native USB); flash through
; that port too, so the 1200 baud touch reaches the running firmware. Pin map
; in include/boards/devkitc_esp32s3.h. Shares the XIAO's USB IDs until the
; USB identity task (D-112) gives it its own.
[env:devkitc_esp32s3]
extends = env:xiao_esp32s3
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags =
    ${env:xiao_esp32s3.build_flags}
    -UDETENT_BOARD_XIAO_ESP32S3
    -DDETENT_BOARD_DEVKITC_ESP32S3
    '-DDETENT_MODEL_NAME="DevKitC"'

[env:devkitc_esp32s3_debug]
extends = env:devkitc_esp32s3
build_flags =
    ${env:devkitc_esp32s3.build_flags}
    -DDETENT_TEST_INJECT=1
    -DDETENT_DIAG=1
    -DDETENT_INPUT_LOG=1

; Host side unit tests for the pure C++ libraries in lib/ (D-035):
;   pio test -d firmware -e native   (or: just fw-test)
; C++11, the strictest common subset, so lib/ code builds anywhere.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Iinclude
    -Wall
    -Wextra
    -Werror

; Raspberry Pi Pico, the full firmware (M7). Built in CI; on hardware once
; Keith solders headers. USB IDs are placeholders (D-092).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#03bb48f3d54b02f8fbe53b9e0543920a0177e466
board = rpipico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<*> -<esp32/> -<pico/spike_main.cpp>
lib_deps =
    olikraus/U8g2 @ 2.36.18
build_flags =
    -DDETENT_BOARD_PICO
    '-DDETENT_MODEL_NAME="Pico"'
    -DUSE_TINYUSB
    -Iinclude
    -Wall
    -Wextra

[env:pico_spike]
; M7 task 1: the Raspberry Pi Pico USB spike (src/pico/spike_main.cpp). The
; Arduino-Pico core (Earle Philhower) through Max Gerhardt's platform fork,
; pinned; Adafruit TinyUSB for the composite HID device (D-092).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#03bb48f3d54b02f8fbe53b9e0543920a0177e466
board = rpipico
framework = arduino
board_build.core = earlephilhower
build_src_filter = -<*> +<pico/> +<../src/version.h>
build_flags =
    -DUSE_TINYUSB
    -Iinclude
    -Wall
lib_ignore = injector, input, menu, modes

