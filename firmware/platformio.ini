; Detent firmware. ESP32-S3, Arduino-ESP32, TinyUSB. See docs/architecture.md.
; Build: pio run -d firmware   (or: just fw)

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
; Pinned so CI and local builds use the same core (Arduino-ESP32 2.0.17).
platform = platformio/espressif32 @ 7.0.1
board = seeed_xiao_esp32s3  ; assumed board, open question in docs/roadmap.md
framework = arduino
monitor_speed = 115200

; The board defaults to the USB-Serial-JTAG peripheral (USB_MODE=1). Detent
; needs TinyUSB on the OTG peripheral (USB_MODE=0) for the composite vendor HID
; and Consumer Control device in M1. CDC on boot is off so src/main.cpp can set
; our VID and PID before USB starts; the variant's Seeed IDs never enumerate.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wall
    -Wextra
