[book]
title = "Detent"
description = "A macOS menu bar app for USB controllers you build yourself."
authors = ["GittieLabs"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["assets/detent.css"]
git-repository-url = "https://github.com/gittielabs/detent"
edit-url-template = "https://github.com/gittielabs/detent/edit/main/site/{path}"
site-url = "/detent/"
